<style>

html,body{
margin:0;
padding:0;
background:#000;
height:100%;
width:100%;
overflow:hidden;
font-family:'Poppins',sans-serif;
}

.video-container{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
}

.shaka-video-container{
width:100%;
height:100%;
position:relative;
}

video{
width:100%;
height:100%;
object-fit:contain;
background:#000;
}

.loading-overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
background:#000;
color:#fff;
z-index:2000;
font-size:18px;
}

.spinner{
border:4px solid rgba(255,255,255,.2);
border-top:4px solid #3b82f6;
border-radius:50%;
width:40px;
height:40px;
animation:spin 1s linear infinite;
margin-bottom:12px;
}

@keyframes spin{
0%{transform:rotate(0deg)}
100%{transform:rotate(360deg)}
}

/* ═══════════════════════════════════════════════
   TELEGRAM BADGE (LEFT SIDE) — FIXED SIZE
═══════════════════════════════════════════════ */
#tgBadge{
  position:fixed;
  top:max(14px, env(safe-area-inset-top));
  left:max(14px, env(safe-area-inset-left));
  z-index:2500;

  display:inline-flex;
  align-items:center;
  gap:8px;

  padding:9px 16px 9px 12px;

  border-radius:100px;
  text-decoration:none;

  font-family:'Poppins',sans-serif;
  font-weight:700;
  font-size:13px;
  letter-spacing:.3px;

  color:#fff;

  background:linear-gradient(135deg,#2AABEE 0%,#229ED9 100%);
  border:1px solid rgba(255,255,255,.25);

  box-shadow:
    0 6px 20px rgba(42,171,238,.4),
    0 0 0 1px rgba(42,171,238,.1);

  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);

  transition:transform .2s ease, box-shadow .2s ease;

  -webkit-tap-highlight-color:transparent;
  white-space:nowrap;
}

#tgBadge:hover{
  transform:translateY(-2px) scale(1.03);
  box-shadow:
    0 10px 28px rgba(42,171,238,.6),
    0 0 0 1px rgba(42,171,238,.2);
}

#tgBadge:active{
  transform:scale(.96);
}

#tgBadge svg{
  width:18px;
  height:18px;
  flex-shrink:0;
  fill:#fff;
  display:block;
}

#tgBadge span{
  white-space:nowrap;
  line-height:1;
}

/* ═══════════════════════════════════════════════
   WHATSAPP BADGE (LEFT SIDE, below Telegram)
═══════════════════════════════════════════════ */

  left:max(14px, env(safe-area-inset-left));
  z-index:2500;

  display:inline-flex;
  align-items:center;

  border-radius:100px;

  background:linear-gradient(135deg,#25D366 0%,#128c7e 100%);

  box-shadow:
    0 6px 20px rgba(37,211,102,.4),
    0 0 0 1px rgba(37,211,102,.1);

  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);

  white-space:nowrap;
}

#waBadge:hover{

/* ── Mobile: keep fixed size, shrink slightly ── */

    left:max(10px, env(safe-area-inset-left));

    gap:6px;

<script>

const params = new URLSearchParams(window.location.search);
const encoded = params.get("data");
let streamUrl = encoded ? atob(encoded) : "";

const video = document.getElementById("video");
const loading = document.getElementById("loading");

/* ── Detect fullscreen state (kept for any future needs) ── */
function updateFsState(){
  const inFs = !!(
    document.fullscreenElement ||
    document.webkitFullscreenElement ||
    document.mozFullScreenElement ||
    document.msFullscreenElement
  );
  document.body.classList.toggle('fs-active', inFs);
}
['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange']
  .forEach(function(ev){ document.addEventListener(ev, updateFsState); });

async function initPlayer(){

  if(!streamUrl){
    alert("Stream URL missing");
    return;
  }

  try{

    const player = new shaka.Player(video);
    const container = document.querySelector(".shaka-video-container");
    const ui = new shaka.ui.Overlay(player, container, video);

    ui.configure({
      controlPanelElements:[
        'play_pause',
        'mute',
        'time_and_duration',
        'spacer',
        'quality',
        'language',
        'picture_in_picture',
        'fullscreen',
        'overflow_menu'
      ],
      addSeekBar:true
    });

    player.configure({
      streaming:{
        bufferingGoal:10,
        rebufferingGoal:2,
        bufferBehind:30
      }
    });

    await player.load(streamUrl);

    video.play().catch(()=>{
      video.muted=true;
      video.play();
    });

    video.addEventListener("playing",()=>{
      loading.style.display="none";
    });

  }

  catch(e){

    console.log("Shaka error:",e);

    video.src = streamUrl;
    video.play();

    video.addEventListener("playing",()=>{
      loading.style.display="none";
    });

  }

}

document.addEventListener("DOMContentLoaded", initPlayer);

</script>
