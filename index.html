<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SPORTLINK - FANCODE</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Tailwind -->
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

<!-- FontAwesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">


<style>
body{
background:#0a0f1c;
font-family:'Poppins',sans-serif;
color:#edf2f7;
}

button{
font-family:'Poppins',sans-serif;
}

.match-tile{
background:#131d2f;
border-radius:32px;
border:1px solid #253247;
overflow:hidden;
display:flex;
flex-direction:column;
box-shadow:0 15px 30px -10px rgba(0,0,0,0.8);
transition:.25s;
}

.match-tile:hover{
background:#17253b;
border-color:#3b82f6;
transform:scale(1.02) translateY(-4px);
box-shadow:0 25px 40px -8px #1e3a8a40;
}

.img-wrapper{
overflow:hidden;
height:210px;
position:relative;
}

.match-img{
width:100%;
height:100%;
object-fit:cover;
}

.live-badge{
background:#b91c1c;
color:white;
font-size:12px;
padding:4px 10px;
border-radius:20px;
position:absolute;
top:12px;
left:12px;
animation:liveBlink 1s infinite;
}

@keyframes liveBlink{
0%{opacity:1;}
50%{opacity:0.3;}
100%{opacity:1;}
}

.scheduled-badge{
background:rgba(0,0,0,.6);
color:white;
font-size:12px;
padding:4px 10px;
border-radius:20px;
position:absolute;
top:12px;
left:12px;
}

.watch-btn{
background:#2563eb;
border-radius:50px;
padding:12px;
font-weight:600;
display:flex;
align-items:center;
justify-content:center;
gap:6px;
margin-top:12px;
cursor:pointer;
}

.watch-btn:hover{
background:#1d4ed8;
}

.not-live{
background:#334155;
cursor:not-allowed;
pointer-events:none;
}

#qualityModal{
position:fixed;
inset:0;
background:rgba(0,0,0,.75);
backdrop-filter:blur(6px);
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
}

#qualityModal.hidden{
display:none;
}

#qualityModal .modal-content{
width:90%;
max-width:360px;
background:#111827;
border-radius:18px;
padding:22px;
text-align:center;
box-shadow:0 20px 40px rgba(0,0,0,.7);
}

#qualityModal h2{
font-size:20px;
font-weight:600;
margin-bottom:18px;
color:#f9fafb;
}

#qualityList{
display:flex;
flex-direction:column;
gap:10px;
}

.quality-item{
background:#1f2937;
border-radius:12px;
padding:14px 16px;
font-size:16px;
font-weight:500;
color:#e5e7eb;
display:flex;
align-items:center;
justify-content:space-between;
cursor:pointer;
transition:.2s;
}

.quality-item::after{
content:">";
font-size:12px;
opacity:.7;
}

.quality-item:hover{
background:#2563eb;
color:white;
transform:translateY(-1px);
}

#qualityModal .btn{
margin-top:16px;
background:#ef4444;
color:white;
border:none;
border-radius:10px;
padding:10px;
font-size:14px;
font-weight:600;
cursor:pointer;
}

#qualityModal .btn:hover{
background:#dc2626;
}

*{
-webkit-user-select:none;
-moz-user-select:none;
-ms-user-select:none;
user-select:none;
}

*{
-webkit-tap-highlight-color: transparent;
}

.match-time{
font-size:13px;
color:#9ca3af;
margin-top:6px;
}
</style>
</head>

<body class="p-5 max-w-7xl mx-auto">

<!-- HEADER -->
<div class="text-center mt-4 mb-8">
  <div class="inline-flex items-center justify-center gap-3 bg-[#131d2f] py-3 px-7 rounded-full border border-blue-900/50">
    <span class="text-3xl font-black tracking-tight text-white">Fancode</span>
  </div>
  <p class="text-gray-500 text-sm mt-3 tracking-wide">FANCODE LIVE WEB</p>
</div>

<!-- MATCH GRID -->
<div id="matches-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 mt-6"></div>

<!-- QUALITY SELECTION MODAL -->
<div id="qualityModal" class="hidden">
  <div class="modal-content">
    <h2>Select Quality</h2>
    <div id="qualityList"></div>
    <button onclick="closeQuality()" class="btn">Close</button>
  </div>
</div>

<script>
const DATA_URL = 'https://raw.githubusercontent.com/doctor-8trange/zyphx8/refs/heads/main/data/fancode.json';
const PLAYER_URL = 'fc-play.html?data=';
const container = document.getElementById("matches-container");

let allMatches = [];

fetch(DATA_URL)
  .then(res => res.json())
  .then(data => {
    allMatches = data.matches || [];
    container.innerHTML = "";

    const matches = allMatches.sort((a, b) => {
      const aLive = (a.status || "").toUpperCase() === "LIVE";
      const bLive = (b.status || "").toUpperCase() === "LIVE";
      return bLive - aLive;
    });

    matches.forEach((m, index) => {
      const isLive = (m.status || "").toUpperCase() === "LIVE";
      const img = m.image || "https://www.fancode.com/skillup-uploads/cms-media/Cricket_Fallback_Old_match-card.jpg";
      const card = document.createElement("div");
      card.className = "match-tile";
      card.innerHTML = `
        <div class="img-wrapper">
          <img src="${img}" class="match-img">
          ${isLive
            ? '<span class="live-badge"><i class="fas fa-circle"></i> LIVE</span>'
            : '<span class="scheduled-badge"><i class="far fa-calendar"></i> SCHEDULED</span>'}
        </div>
        <div class="p-5 flex flex-col flex-1">
          <h3 class="text-xl font-bold">${m.title || 'Match'}</h3>
          <div class="text-sm text-gray-400 mt-2">${m.tournament || ''}</div>
          <div class="match-time">${formatDate(m.startTime)}</div>
          ${isLive
            ? `<div onclick="openQuality(${index})" class="watch-btn"><i class="fas fa-play"></i> WATCH NOW</div>`
            : `<div class="watch-btn not-live"><i class="far fa-clock"></i> NOT LIVE</div>`}
        </div>
      `;
      container.appendChild(card);
    });
  })
  .catch(() => {
    container.innerHTML = "<p class='text-center col-span-full'>Failed to load matches</p>";
  });

function formatDate(time) {
  if (!time) return "";
  const d = new Date(time);
  return d.toLocaleString("en-IN", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}

function openQuality(index) {
  const match = allMatches[index];
  const streamData = match.auto_streams?.[0]?.auto || "";

  if (!streamData) { alert("Stream not available"); return; }

  const lines = streamData.split("\n");
  let qualities = [];

  lines.forEach((line, i) => {
    if (line.includes("RESOLUTION=")) {
      const resolution = line.split("RESOLUTION=")[1].split(",")[0].split("x")[1] + "p";
      const streamUrl = lines[i + 1].trim();
      qualities.push({ res: resolution, url: streamUrl });
    }
  });

  if (qualities.length === 0) { alert("No stream qualities found"); return; }

  const list = document.getElementById("qualityList");
  list.innerHTML = "";

  qualities.forEach(q => {
    const btn = document.createElement("div");
    btn.className = "quality-item";
    btn.innerText = q.res;
    btn.onclick = function () {
      const encoded = btoa(q.url);
      window.location.href = PLAYER_URL + encodeURIComponent(encoded);
    };
    list.appendChild(btn);
  });

  document.getElementById("qualityModal").classList.remove("hidden");
}

function closeQuality() {
  document.getElementById("qualityModal").classList.add("hidden");
}
</script>

</body>
</html>
