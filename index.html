<style>
body{
background:#0a0f1c;
font-family:'Poppins',sans-serif;
color:#edf2f7;
}

button{
font-family:'Poppins',sans-serif;
}

.match-tile{
background:#131d2f;
border-radius:32px;
border:1px solid #253247;
overflow:hidden;
display:flex;
flex-direction:column;
box-shadow:0 15px 30px -10px rgba(0,0,0,0.8);
transition:.25s;
}

.match-tile:hover{
background:#17253b;
border-color:#3b82f6;
transform:scale(1.02) translateY(-4px);
box-shadow:0 25px 40px -8px #1e3a8a40;
}

.img-wrapper{
overflow:hidden;
height:210px;
position:relative;
}

.match-img{
width:100%;
height:100%;
object-fit:cover;
}

.live-badge{
background:#b91c1c;
color:white;
font-size:12px;
padding:4px 10px;
border-radius:20px;
position:absolute;
top:12px;
left:12px;
animation:liveBlink 1s infinite;
}

@keyframes liveBlink{
0%{opacity:1;}
50%{opacity:0.3;}
100%{opacity:1;}
}

.scheduled-badge{
background:rgba(0,0,0,.6);
color:white;
font-size:12px;
padding:4px 10px;
border-radius:20px;
position:absolute;
top:12px;
left:12px;
}

.watch-btn{
background:#2563eb;
border-radius:50px;
padding:12px;
font-weight:600;
display:flex;
align-items:center;
justify-content:center;
gap:6px;
margin-top:12px;
cursor:pointer;
}

.watch-btn:hover{
background:#1d4ed8;
}

.not-live{
background:#334155;
cursor:not-allowed;
pointer-events:none;
}

#qualityModal{
position:fixed;
inset:0;
background:rgba(0,0,0,.75);
backdrop-filter:blur(6px);
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
}

#qualityModal.hidden{
display:none;
}

#qualityModal .modal-content{
width:90%;
max-width:360px;
background:#111827;
border-radius:18px;
padding:22px;
text-align:center;
box-shadow:0 20px 40px rgba(0,0,0,.7);
}

#qualityModal h2{
font-size:20px;
font-weight:600;
margin-bottom:18px;
color:#f9fafb;
}

#qualityList{
display:flex;
flex-direction:column;
gap:10px;
}

.quality-item{
background:#1f2937;
border-radius:12px;
padding:14px 16px;
font-size:16px;
font-weight:500;
color:#e5e7eb;
display:flex;
align-items:center;
justify-content:space-between;
cursor:pointer;
transition:.2s;
}

.quality-item::after{
content:">";
font-size:12px;
opacity:.7;
}

.quality-item:hover{
background:#2563eb;
color:white;
transform:translateY(-1px);
}

#qualityModal .btn{
margin-top:16px;
background:#ef4444;
color:white;
border:none;
border-radius:10px;
padding:10px;
font-size:14px;
font-weight:600;
cursor:pointer;
}

#qualityModal .btn:hover{
background:#dc2626;
}

*{
-webkit-user-select:none;
-moz-user-select:none;
-ms-user-select:none;
user-select:none;
}

*{
-webkit-tap-highlight-color: transparent;
}

.match-time{
font-size:13px;
color:#9ca3af;
margin-top:6px;
}

display:flex;
align-items:center;
justify-content:center;
gap:8px;
margin-top:12px;
flex-wrap:wrap;
}

.social-link{
display:inline-flex;
align-items:center;
gap:6px;
padding:7px 14px;
background:#131d2f;
border:1px solid #253247;
border-radius:50px;
color:#e5e7eb;
font-size:12px;
font-weight:600;
text-decoration:none;
transition:all .25s;
white-space:nowrap;
font-family:'Poppins',sans-serif;
}

.social-link:hover{
background:#17253b;
border-color:#3b82f6;
color:#fff;
transform:translateY(-2px);
box-shadow:0 8px 20px -6px #1e3a8a60;
}

.social-link:active{
transform:translateY(0) scale(.96);
}

.social-link svg{
width:14px;
height:14px;
flex-shrink:0;
}

.social-link.tg-link svg{
fill:#29b6f6;
}

.social-link.wa-link svg{
fill:#25D366;
}

@media (max-width:420px){

font-size:11px;
gap:5px;
}

height:12px;

/* ====== TELEGRAM POPUP ====== */
#tgOverlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 999999;
  padding: 20px;
  animation: fadeInPopup 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
}

#tgOverlay.show {
  display: flex;
}

#tgCard {
  width: 100%;
  max-width: 400px;
  background: linear-gradient(160deg, #121821, #0a0c0f);
  border: 1px solid rgba(79, 195, 247, 0.15);
  border-radius: 24px;
  padding: 36px 28px 28px;
  box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8), 0 0 60px rgba(79, 195, 247, 0.03);
  text-align: center;
  position: relative;
  overflow: hidden;
}

#tgCard::before {
  content: "";
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle at 30% 20%, rgba(79, 195, 247, 0.04), transparent 60%);
  pointer-events: none;
}

#tgIcon {
  width: 72px;
  height: 72px;
  margin: 0 auto 16px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #2AABEE, #229ED9);
  box-shadow: 0 0 40px rgba(42, 171, 238, 0.2);
  position: relative;
  z-index: 1;
}

#tgIcon svg {
  width: 36px;
  height: 36px;
}

#tgCard h2 {
  margin: 0 0 8px;
  font-size: clamp(1.3rem, 2.5vw, 1.8rem);
  font-weight: 700;
  color: #ffffff;
  font-family: 'Poppins', system-ui, sans-serif;
  position: relative;
  z-index: 1;
  letter-spacing: -0.01em;
}

#tgCard p {
  margin: 0 0 24px;
  color: #8e9baf;
  font-size: clamp(0.9rem, 1.2vw, 1.05rem);
  line-height: 1.6;
  position: relative;
  z-index: 1;
}

.tgBtns {
  display: flex;
  gap: 12px;
  position: relative;
  z-index: 1;
}

.tgBtn {
  flex: 1;
  height: 48px;
  border-radius: 40px;
  font-weight: 700;
  font-size: clamp(0.85rem, 1vw, 1rem);
  cursor: pointer;
  transition: all 0.25s ease;
  border: none;
  font-family: 'Poppins', sans-serif;
  letter-spacing: 0.01em;
}

#joinNow {
  background: linear-gradient(135deg, #4fc3f7, #2196f3);
  color: #ffffff;
  box-shadow: 0 6px 24px rgba(79, 195, 247, 0.25);
}

#joinNow:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 32px rgba(79, 195, 247, 0.35);
}

#joinedBtn {
  background: rgba(255, 255, 255, 0.05);
  color: #8e9baf;
  border: 1px solid rgba(255, 255, 255, 0.08);
}

#joinedBtn:hover {
  background: rgba(255, 255, 255, 0.08);
  color: #ffffff;
}

@keyframes fadeInPopup {
  from {
    opacity: 0;
    transform: scale(0.95) translateY(12px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

@media (max-width: 480px) {
  #tgCard {
    padding: 24px 18px 20px;
    border-radius: 20px;
  }
  #tgIcon {
    width: 60px;
    height: 60px;
  }
  #tgIcon svg {
    width: 30px;
    height: 30px;
  }
  #tgCard h2 {
    font-size: 1.2rem;
  }
  #tgCard p {
    font-size: 0.85rem;
    margin-bottom: 18px;
  }
  .tgBtn {
    height: 42px;
    font-size: 0.8rem;
  }
}
</style>
</head>

<!-- QUALITY SELECTION MODAL -->
<div id="qualityModal" class="hidden">

    <button onclick="closeQuality()" class="btn">Close</button>

<!-- ====== TELEGRAM POPUP ====== -->
<div id="tgOverlay">
  <div id="tgCard">
    <div id="tgIcon">
      <svg viewBox="0 0 24 24" fill="white" width="36" height="36">
        <path d="M23.05 2.1L19.6 21.3c-.26 1.15-.94 1.43-1.9.9l-5.26-3.88-2.54 2.45c-.28.28-.52.52-1.06.52l.38-5.4L19.9 5.8c.46-.4-.1-.63-.72-.23L7.5 13.03l-5.24-1.64c-1.14-.36-1.16-1.14.24-1.68L21.6.9c.95-.36 1.78.23 1.45 1.2z"/>
      </svg>
    </div>
    <h2>Join Telegram Channel</h2>
    <p>Get match links &amp; live updates delivered straight to your phone.</p>
    <div class="tgBtns">
      <button class="tgBtn" id="joinedBtn">Already Joined</button>
      <button class="tgBtn" id="joinNow">Join Now</button>
    </div>
  </div>
</div>

<script>
const DATA_URL = 'https://raw.githubusercontent.com/kajju027/Fancode-Events-Json/refs/heads/main/fancode.json';
const PLAYER_URL = 'fc-play.html?data=';
const container = document.getElementById("matches-container");

let allMatches = [];

fetch(DATA_URL)
  .then(res => res.json())
  .then(data => {
    allMatches = data.matches || [];
    container.innerHTML = "";

    const matches = allMatches.sort((a, b) => {
      const aLive = (a.status || "").toUpperCase() === "LIVE";
      const bLive = (b.status || "").toUpperCase() === "LIVE";
      return bLive - aLive;
    });

    matches.forEach((m, index) => {
      const isLive = (m.status || "").toUpperCase() === "LIVE";
      const img = m.image || "https://www.fancode.com/skillup-uploads/cms-media/Cricket_Fallback_Old_match-card.jpg";
      const card = document.createElement("div");
      card.className = "match-tile";
      card.innerHTML = `
        <div class="img-wrapper">
          <img src="${img}" class="match-img">
          ${isLive
            ? '<span class="live-badge"><i class="fas fa-circle"></i> LIVE</span>'
            : '<span class="scheduled-badge"><i class="far fa-calendar"></i> SCHEDULED</span>'}
        </div>
        <div class="p-5 flex flex-col flex-1">
          <h3 class="text-xl font-bold">${m.title || 'Match'}</h3>
          <div class="text-sm text-gray-400 mt-2">${m.tournament || ''}</div>
          <div class="match-time">${formatDate(m.startTime)}</div>
          ${isLive
            ? `<div onclick="openQuality(${index})" class="watch-btn"><i class="fas fa-play"></i> WATCH NOW</div>`
            : `<div class="watch-btn not-live"><i class="far fa-clock"></i> NOT LIVE</div>`}
        </div>
      `;
      container.appendChild(card);
    });
  })
  .catch(() => {
    container.innerHTML = "<p class='text-center col-span-full'>Failed to load matches</p>";
  });

function formatDate(time) {
  if (!time) return "";
  // Try to parse "07:00:00 AM 10-09-2026" format
  const parts = time.match(/(\d{2}):(\d{2}):(\d{2})\s*(AM|PM)\s*(\d{2})-(\d{2})-(\d{4})/i);
  if (parts) {
    let [, hh, mm, ss, ampm, dd, mo, yyyy] = parts;
    hh = parseInt(hh, 10);
    if (ampm.toUpperCase() === 'PM' && hh < 12) hh += 12;
    if (ampm.toUpperCase() === 'AM' && hh === 12) hh = 0;
    const d = new Date(yyyy, parseInt(mo, 10) - 1, parseInt(dd, 10), hh, parseInt(mm, 10), parseInt(ss, 10));
    return d.toLocaleString("en-IN", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  }
  const d = new Date(time);
  if (isNaN(d)) return time;
  return d.toLocaleString("en-IN", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}

function openQuality(index) {
  const match = allMatches[index];
  // Use auto_streams: { ENGLISH: { streams: { "1080p": url, ... } } }
  const streams = match.auto_streams && match.auto_streams.ENGLISH && match.auto_streams.ENGLISH.streams;
  if (!streams || Object.keys(streams).length === 0) {
    alert("Stream not available");
    return;
  }

  const list = document.getElementById("qualityList");
  list.innerHTML = "";

  // Sort qualities high to low
  const order = ['1080p','720p','540p','480p','360p','240p'];
  const sortedKeys = Object.keys(streams).sort((a, b) => order.indexOf(b) - order.indexOf(a));

  sortedKeys.forEach(q => {
    const btn = document.createElement("div");
    btn.className = "quality-item";
    btn.innerText = q;
    btn.onclick = function () {
      const encoded = btoa(streams[q]);
      window.location.href = PLAYER_URL + encodeURIComponent(encoded);
    };
    list.appendChild(btn);
  });

  document.getElementById("qualityModal").classList.remove("hidden");
}

function closeQuality() {
  document.getElementById("qualityModal").classList.add("hidden");
}

/* ====== TELEGRAM POPUP SCRIPT ====== */
(function () {
  const tgOverlay = document.getElementById('tgOverlay');

  function closePopup() {
    tgOverlay.classList.remove('show');
  }

  // Show popup after 3 seconds
  setTimeout(function () {
    tgOverlay.classList.add('show');
  }, 3000);

  // Join Now → open Telegram link, then close
  document.getElementById('joinNow').onclick = function () {
    window.open('https://t.me/sportlink10', '_blank');
    closePopup();
  };

  // Already Joined → just close
  document.getElementById('joinedBtn').onclick = function () {
    closePopup();
  };

  // Click on dark backdrop → close
  tgOverlay.addEventListener('click', function (e) {
    if (e.target === tgOverlay) {
      closePopup();
    }
  });

  // ESC key → close
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && tgOverlay.classList.contains('show')) {
      closePopup();
    }
  });
})();
</script>
